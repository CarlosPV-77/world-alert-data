name: GDELT news
# GDELT refuses Vercel's servers, so this job reads it every 15 minutes and publishes
# conflictos.json and atentados.json on the "live" branch, which the map's bridge reads. Their headlines are
# translated into Spanish offline with Argos Translate models, kept in the Actions cache between runs.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gdelt
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODELS: /home/runner/argos-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: node scripts/fetch.mjs
        env: { SOURCES: "conflictos,atentados" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scripts/requirements-translate.txt }
      - run: pip install -r scripts/requirements-translate.txt
      - id: models
        uses: actions/cache@v4
        with: { path: "${{ env.MODELS }}", key: argos-en_es-1_0-pt_es-1_0-fr_en-1_9 }
      - name: Download translation models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          for m in en_es-1_0 pt_es-1_0 fr_en-1_9; do
            curl -fsSL --retry 3 -o /tmp/m.zip "https://argos-net.com/v1/translate-$m.argosmodel"
            mkdir -p "$MODELS/${m%-*}" && unzip -q /tmp/m.zip -d "$MODELS/${m%-*}"
          done
      # A failed translation never holds back the news: the headlines then go out in their original language.
      - name: Translate headlines
        continue-on-error: true
        run: python scripts/translate.py "$MODELS" data/conflictos.json data/atentados.json
      - name: Keep the files of a test run
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: gdelt
          path: |
            data/conflictos.json
            data/atentados.json
      # One orphan commit, force-pushed, so the branch never grows a history.
      - name: Publish to live branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/live && cp data/conflictos.json data/atentados.json /tmp/live/
          cd /tmp/live
          git init -q -b live
          git config user.name "world-alert-bot"
          git config user.email "world-alert-bot@users.noreply.github.com"
          git add . && git commit -qm "GDELT $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live
