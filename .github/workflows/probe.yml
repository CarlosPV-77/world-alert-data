name: Probe endpoints
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs"
        default: ""
      script:
        description: "Node script to run from the repo"
        default: ""
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env: { URLS: "${{ inputs.urls }}" }
        run: |
          [ -z "$URLS" ] && exit 0
          for u in $URLS; do
            echo "== $u"
            curl -sS -m 30 -L -o body -w "HTTP %{http_code} %{size_download}B %{time_total}s\n" "$u" || true
            head -c 600 body; echo; sleep 6
          done
      - uses: actions/checkout@v4
        if: inputs.script != ''
      - uses: actions/setup-node@v4
        if: inputs.script != ''
        with: { node-version: 22 }
      - if: inputs.script != ''
        env: { SCRIPT: "${{ inputs.script }}" }
        run: node "$SCRIPT"
